[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "market-insight-workbench"
version = "0.2.0"
description = "Attributed financial research workbench with bounded data retrieval and explicit evidence"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Hema Kalyan Murapaka"}]
maintainers = [{name = "Sushant Nemade"}]
dependencies = [
    "fastapi>=0.143,<1", "pydantic>=2.12.5,<3", "uvicorn>=0.54,<1",
    "httpx>=0.28,<1", "yfinance>=0.2.66,<1", "curl-cffi>=0.13,<1",
    "openai>=2.21,<3", "pandas>=2.3,<4",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.17,<0.18", "pip-audit>=2.10,<3", "build>=1.2,<2", "twine>=6.2,<8"]

[tool.setuptools.packages.find]
include = ["MarketInsight*", "config*"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
MarketInsight = ["web/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
