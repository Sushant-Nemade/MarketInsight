name: Verify Market Insight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-market-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev pytest -q
      - run: uv run --frozen --group dev ruff check .
      - run: uv run --frozen --group dev ruff format --check .
      - run: uv run --frozen --group dev python -m scripts.build_demo
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build -- --logLevel error
        working-directory: frontend
      - run: node scripts/licenses.mjs
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - run: npm test -- --reporter=line
        working-directory: frontend
      - run: uv run --frozen --group dev python -m scripts.prepare_site
      - run: uv run --frozen --group dev python -m build
      - run: uv run --frozen --group dev python -m scripts.verify_release
      - run: uv run --frozen --group dev python -m twine check dist/*
      - run: uv run --frozen --group dev pip-audit --local --skip-editable --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: market-insight-reference
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence-${{ matrix.os }}
          path: frontend/test-results/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t market-insight-reference .
      - name: Check non-root image and installed sample UI
        run: |
          test "$(docker inspect market-insight-reference --format '{{.Config.User}}')" = market
          docker run --rm market-insight-reference /app/.venv/bin/python -c "from fastapi.testclient import TestClient; from main import app; client=TestClient(app); assert client.get('/health').status_code==200; assert client.get('/').status_code==200; assert client.get('/api/reports').status_code==503"