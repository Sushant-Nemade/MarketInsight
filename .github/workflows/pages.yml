name: Deploy Market Insight Reference

on:
  workflow_run:
    workflows: [Verify Market Insight]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verified_ci_run_id:
        description: Successful current-main CI run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: market-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
    uses: Sushant-Nemade/autonomous-quality-redteam-harness/.github/workflows/maintenance-deployment-proof.yml@32edbe2463f9bda3fb07bac7926382c2d0255aed
    with:
      controller_ref: 32edbe2463f9bda3fb07bac7926382c2d0255aed
      completed_run_id: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_ci_run_id || format('{0}', github.event.workflow_run.id) }}
  deploy:
    needs: verify
    if: needs.verify.outputs.verified_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m scripts.build_demo
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build -- --base=/${{ github.event.repository.name }}/ --logLevel error
        working-directory: frontend
      - run: node scripts/licenses.mjs
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Confirm verified main is still current
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== process.env.VERIFIED_SHA) core.setFailed('Main changed; refusing stale deployment');
      - name: Publish reference site
        id: deployment
        uses: actions/deploy-pages@v4